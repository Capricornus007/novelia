name: Preview APK
run-name: ARM64 Release preview · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Release preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk-artifact-id: ${{ steps.apk.outputs.artifact-id }}
      info-artifact-id: ${{ steps.build-info.outputs.artifact-id }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore shared preview signing key
        env:
          NOVELIA_PREVIEW_KEYSTORE_BASE64: ${{ secrets.NOVELIA_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 scripts/restore_preview_signing.py

      - name: Read pinned native toolchain
        id: toolchain
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import os
          from pathlib import Path
          for line in Path('gradle/ech-native.properties').read_text(encoding='utf-8').splitlines():
              if line.startswith('ndkVersion='):
                  ndk_version = line.split('=', 1)[1].strip()
                  break
          else:
              raise SystemExit('Missing ndkVersion in gradle/ech-native.properties.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'ndk-version={ndk_version}\n')
          PY

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;${{ steps.toolchain.outputs.ndk-version }}

      - name: Set up pinned Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/ech/go.mod
          # Gradle uses outputs/ech-tools instead of Go's default cache locations.
          cache: false

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache native build dependencies
        uses: actions/cache@v6
        with:
          path: |
            outputs/ech-tools/modules
            outputs/ech-tools/cache
            outputs/ech-tools/gopath/bin
          key: ${{ runner.os }}-${{ runner.arch }}-ech-${{ hashFiles('gradle/ech-native.properties', 'native/ech/**/go.mod', 'native/ech/**/go.sum') }}-${{ hashFiles('native/ech/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ech-${{ hashFiles('gradle/ech-native.properties', 'native/ech/**/go.mod', 'native/ech/**/go.sum') }}-

      - name: Build signed Release preview
        env:
          NOVELIA_MIRROR_ACCESS_TOKEN: ${{ secrets.NOVELIA_MIRROR_ACCESS_TOKEN }}
        run: |
          # The same pinned test key as the local Release build; missing keys never fall back.
          ./gradlew --no-daemon --console=plain :app:assembleRelease -PreleaseSigning=false -PlocalReleaseSigning=true -PtargetAbi=arm64-v8a

      - name: Verify and prepare preview artifacts
        id: package
        run: |
          set -euo pipefail
          python3 scripts/prepare_preview.py

      - name: Upload preview APK
        id: apk
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.apk-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum, build info and R8 mapping
        id: build-info
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}-build-info
          path: |
            outputs/preview/*.sha256
            outputs/preview/*-build-info.txt
            outputs/preview/*-mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Add download links to build summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          BUILD_INFO_URL: ${{ steps.build-info.outputs.artifact-url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ARM64 Release 预览包已构建，包含 R8 压缩与资源收缩，与本地构建共用固定预览测试证书。

          [下载 APK]($APK_URL) · [下载校验文件、构建信息和 R8 映射]($BUILD_INFO_URL)

          产物保留 14 天，下载需要登录 GitHub。同签名本地包可覆盖安装，新包版本码须不低于已安装版本。
          EOF
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '默认分支构建：接下来由 Update preview Pre-release 任务发布，结果请查看该任务。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '当前为非默认分支：仅保留 Actions 下载产物，不更新 Pre-release。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/novelia-preview.keystore"

  publish:
    name: Update preview Pre-release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: preview-prerelease
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout publication script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download this build's verified artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.apk-artifact-id }},${{ needs.build.outputs.info-artifact-id }}
          path: outputs/publish-preview
          merge-multiple: true

      - name: Create or update rolling Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIEW_RELEASE_TAG: ${{ vars.NOVELIA_PREVIEW_TAG || 'preview' }}
        run: python3 scripts/publish_preview.py --artifacts-directory outputs/publish-preview --tag "$PREVIEW_RELEASE_TAG"
